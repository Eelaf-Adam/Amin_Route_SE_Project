services:
  # 1. PostGIS Database Container
  db:
    image: postgis/postgis:15-3.3
    container_name: amin_route_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-amin_route_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-amin_route_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. FastAPI Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amin_route_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secure_password_2026}@db:5432/${POSTGRES_DB:-amin_route_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password_2026}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-amin_route_db}
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-amin_route_super_secret_jwt_key_2026}
      - ALLOWED_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. React Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amin_route_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: