services:
  - type: web
    name: amin-route-backend
    env: docker                         # Use Dockerfile, not native Python
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amin-route-db
          property: connectionString    # Auto-wired from Render DB
      - key: SECRET_KEY
        generateValue: true             # Render auto-generates a secure value
      - key: ALLOWED_ORIGINS
        value: "https://amin-route-frontend.onrender.com"
      - key: APP_ENV
        value: production

  - type: web
    name: amin-route-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://amin-route-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html        # SPA routing

databases:
  - name: amin-route-db
    databaseName: amin_route_db
    user: postgres
    plan: free
    region: oregon
